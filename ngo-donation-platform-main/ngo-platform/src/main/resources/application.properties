spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ngo_platform}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:aneesh}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
server.port=${SERVER_PORT:8080}

# Local-development fallback only. Set JWT_SECRET to a unique secret outside development.
app.jwt.secret=${JWT_SECRET:development-only-secret-change-before-deploy-2026-ngo-platform}
